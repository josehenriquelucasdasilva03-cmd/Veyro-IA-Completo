name: GitHub Pages Veyro Preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: veyro-github-pages-preview
  cancel-in-progress: true
jobs:
  publish-static-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/consolidacao-veyro-chat-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # npm test builds both bundles and runs regression checks before publication.
      - run: npm test
      - run: touch dist/site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
