name: GitHub Pages Veyro Preview
on:
  push:
    branches:
      - integration/consolidacao-veyro-chat-20261012
    paths:
      - '.github/workflows/pages-preview.yml'
      - 'src/frontend/**'
      - 'scripts/build.mjs'
      - 'scripts/build-netlify.mjs'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: veyro-github-pages-preview
  cancel-in-progress: true
jobs:
  publish-static-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-netlify.mjs
      - run: touch dist/site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
