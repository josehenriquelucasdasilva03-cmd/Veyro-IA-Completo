name: Animation Browser QA
on:
  push:
    branches: [qa/animacao-navegador-20261012]
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - '.github/workflows/animation-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/build-netlify.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animation-qa-failures
          path: test-results/
          if-no-files-found: ignore
