name: Video bridge CI
on:
  push:
    branches: [feature/video-studio-gateway-20261011]
  pull_request:
    paths:
      - 'src/media/video-gateway.js'
      - 'tests/video.test.mjs'
      - '.github/workflows/video-bridge-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
