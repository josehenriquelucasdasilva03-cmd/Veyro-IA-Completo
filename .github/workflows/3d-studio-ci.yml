name: Veyro 3D Studio CI
on:
  pull_request:
    paths:
      - 'src/frontend/components/model3d-*.js'
      - 'src/frontend/styles/model3d.css'
      - 'src/frontend/index.html'
      - 'scripts/build.mjs'
      - 'tests/model3d.test.mjs'
      - '.github/workflows/3d-studio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-netlify.mjs
      - run: npm test
