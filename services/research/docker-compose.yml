name: veyro-local-research

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8081/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Run npm run setup to generate local secrets}"
      SEARXNG_LIMITER: "false"
      SEARXNG_VALKEY_URL: "valkey://valkey:6379/0"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data

  reader:
    build:
      context: ../web-reader
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      READER_KEY: "${WEB_READER_KEY:?Run npm run setup to generate local secrets}"

volumes:
  searxng-cache:
  valkey-data:
